<div class="content-body">
  <div class="container-fluid">
    <div class="col-md-12">
      <div class="card" style="display: grid; align-content: center;">

        <div class="container my-5">
          <div class="mat-elevation-z8">

            <!-- Filter input field -->
            <div class="filter-container">
              <mat-form-field appearance="outline" class="filter-field">
                <mat-label>Filter</mat-label>
                <input matInput (keyup)="applyFilter($event)" placeholder="Filter results" />
              </mat-form-field>
            </div>

            <!-- Material table with columns and pagination -->
            <table mat-table [dataSource]="dataSource" matSort>

              <!-- Accession Number Column -->
              <ng-container matColumnDef="accessionNo">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Accession No</th>
                <td mat-cell *matCellDef="let element">{{ element.accessionNo }}</td>
              </ng-container>

              <!-- Prediction Column -->
              <ng-container matColumnDef="prediction">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>Prediction</th>
                <td mat-cell *matCellDef="let element">
                  {{ getPredictionLabel(element.score) }}
                </td>
              </ng-container>
              <ng-container matColumnDef="score">
                <th mat-header-cell *matHeaderCellDef mat-sort-header>score</th>
                <td mat-cell *matCellDef="let element">{{ getRatingFromScore(element.score) }}</td>
              </ng-container>
              <!-- Table Header and Row Definitions -->
              <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
              <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
            </table>

            <!-- Pagination Controls -->
            <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons></mat-paginator>
          </div>

        </div>
      </div>
    </div>
  </div>
</div>
